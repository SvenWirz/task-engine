# H2-In-Memory für Tests. Flyway aus (V1 ist PG-spezifisch), Schema via schema.sql.
# Default-DB; Engine-Tests überschreiben die URL je Klasse, damit der jeweils eigene
# (gecachte) Dispatcher-Thread nicht die Tasks anderer Kontexte aus einer geteilten
# In-Memory-DB klaut.
spring.datasource.url=jdbc:h2:mem:te-default;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.sql.init.mode=always

# R0-Tests prüfen reines Enqueue-Verhalten; Worker-Seite bleibt aus.
taskengine.enabled=false

logging.level.io.github.svenwirz=INFO
