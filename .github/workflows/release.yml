name: Release

# Ein Push eines SemVer-Tags (z. B. v1.2.0) löst Build + Veröffentlichung
# des Starters nach GitHub Packages aus. Die Version stammt aus dem Tag.
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. 1.2.0 (ohne führendes v)'
        required: true

permissions:
  contents: write   # GitHub Release anlegen
  packages: write   # nach GitHub Packages veröffentlichen

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Schreibt eine settings.xml mit dem Server 'github' passend zur
          # distributionManagement-ID; Credentials kommen aus den Env-Vars unten.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Version aus Tag bzw. Eingabe ableiten
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # Baut Parent + Starter (-am), führt die Tests aus und deployt beide POMs
      # nach GitHub Packages. Die Beispielanwendung ist nicht Teil des Reaktors
      # und zusätzlich per maven.deploy.skip ausgenommen.
      - name: Build, test & deploy nach GitHub Packages
        run: >
          ./mvnw -B --no-transfer-progress
          -Drevision=${VERSION}
          -Dgithub.repository=${GITHUB_REPOSITORY}
          -Prelease
          -pl task-engine-starter -am
          clean deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
